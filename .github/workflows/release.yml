name: Release preparation

# Manual dispatch only. Builds and validates a release candidate and
# uploads it as a run artifact for a maintainer to inspect. Nothing
# publishes, signs, or tags here: those steps need owner credentials
# and happen outside CI (see docs/RELEASING.md).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel baked into the build
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
      ref:
        description: Commit, branch, or tag to build
        required: false
        default: main

jobs:
  candidate:
    name: Build release candidate (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Check backend syntax
        run: npm run check:syntax

      - name: Check test manifest
        run: npm run check:test-manifest

      - name: Typecheck
        run: npx tsc -b

      - name: Scan for committed secrets
        shell: pwsh
        run: |
          $hits = @()
          if (Test-Path .env) { $hits += '.env file present' }
          $patterns = @('BEGIN PRIVATE KEY', 'AKIA[0-9A-Z]{16}')
          foreach ($pattern in $patterns) {
            $found = Get-ChildItem -Recurse -File -Include *.cjs,*.ts,*.tsx,*.js,*.json,*.md -Exclude *.test.cjs |
              Select-String -Pattern $pattern -List |
              Where-Object { $_.Path -notlike '*node_modules*' }
            foreach ($match in $found) { $hits += "$($match.Path): $($match.LineNumber)" }
          }
          if ($hits.Count -gt 0) {
            Write-Error ("Secret scan hits:`n" + ($hits -join "`n"))
            exit 1
          }
          Write-Host 'Secret scan clean.'

      - name: Build installers
        shell: pwsh
        run: |
          if ('${{ inputs.channel }}' -eq 'preview') { npm run dist:preview } else { npm run dist }

      - name: Verify release contents
        run: npm run check:release

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kryomcode-${{ inputs.channel }}-candidate
          path: release/
          retention-days: 14
