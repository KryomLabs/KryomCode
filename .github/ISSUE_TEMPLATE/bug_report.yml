name: Bug report
description: Report a bug or unexpected behavior in KryomCode.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Clearly describe the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Open KryomCode.
        2. Open a project.
        3. Perform the action.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KryomCode version
      placeholder: "0.1.0"

  - type: input
    id: environment
    attributes:
      label: Operating system and environment
      placeholder: "Windows 11, Node.js version, etc."

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include relevant error messages. Remove secrets and API keys before posting.
